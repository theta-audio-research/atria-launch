<div onClick="{{ closeZoom }}" style="position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;display:{{ overlayDisplay }};align-items:center;justify-content:center;cursor:zoom-out;padding:40px;box-sizing:border-box">

</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { zoomed: null };
  componentDidMount() {
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ zoomed: null }); };
    document.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() { document.removeEventListener('keydown', this._esc); }
  componentDidUpdate() {
    const el = this._zoomImgEl;
    if (!el) return;
    const want = this.state.zoomed ? this.state.zoomed.src : null;
    if (this._lastZoomSrc === want) return;
    this._lastZoomSrc = want;
    if (want) el.src = want; else el.removeAttribute('src');
  }
  _mk(src, w, r) { return (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ zoomed: { src, w, r } }); }; }
  renderVals() {
    const z = this.state.zoomed;
    return {
      overlayDisplay: z ? 'flex' : 'none',
      zoomedWidth: z ? z.w : 0,
      zoomedRatio: z ? z.r : 1,
      setZoomImg: (el) => { this._zoomImgEl = el; if (el && z && z.src) { el.src = z.src; this._lastZoomSrc = z.src; } },
      closeZoom: () => this.setState({ zoomed: null }),
      stopClick: (e) => e.stopPropagation(),
      openRed: this._mk('assets/rgb/red.png?v=260824', 1332, 1332 / 1370),
      openGreen: this._mk('assets/rgb/green.png?v=260824', 1332, 1332 / 1370),
      openBlue: this._mk('assets/rgb/blue.png?v=260824', 1332, 1332 / 1370),
      openBrown: this._mk('assets/rgb/brown.png?v=260824', 1332, 1332 / 1370),
      openGrey: this._mk('assets/rgb/grey.png?v=260824d', 1332, 1332 / 1370),
      openBlack: this._mk('assets/rgb/black.png?v=260824d', 1332, 1332 / 1370),
    };
  }
}
</script>
