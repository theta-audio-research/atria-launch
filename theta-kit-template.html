<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>THETA AUDIO RESEARCH</title>
<!--[if mso]><style>body,table,td,a{font-family:Arial,Helvetica,sans-serif !important}</style><![endif]-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap');

/* --- styles for content written in Kit's editor --- */
.th-body h1,.th-body h2,.th-body h3{font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif !important;color:#DCCDBF !important;text-transform:uppercase;letter-spacing:5px;font-weight:normal;margin:0 0 18px 0;line-height:1.3}
.th-body h1{font-size:26px}
.th-body h2{font-size:19px}
.th-body h3{font-size:14px;letter-spacing:4px;font-weight:bold}
.th-body p{font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif !important;font-size:15px;line-height:27px;color:#B0B2B7 !important;margin:0 0 20px 0}
.th-body a{color:#FFB162 !important;text-decoration:underline}
.th-body ul,.th-body ol{font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif !important;font-size:15px;line-height:27px;color:#B0B2B7 !important;padding-left:22px;margin:0 0 20px 0}
.th-body li{margin-bottom:8px}
.th-body hr{border:0;border-top:1px solid #3A3534;margin:28px 0}
.th-body strong{color:#DCCDBF !important}
.th-body blockquote{border-left:2px solid #FFB162;margin:0 0 20px 0;padding:2px 0 2px 20px;font-family:'JetBrains Mono','Courier New',Courier,monospace !important;font-size:13px;line-height:24px;color:#81848A !important}
/* Kit's editor wraps buttons in .email-button — this makes them match the site */
.th-body .email-button{text-align:left !important;margin:8px 0 24px 0}
.th-body .email-button a{display:inline-block !important;background-color:#DCCDBF !important;color:#0C1519 !important;font-family:'JetBrains Mono','Courier New',Courier,monospace !important;font-size:11px !important;letter-spacing:5px !important;text-transform:uppercase;font-weight:bold;text-decoration:none !important;padding:17px 34px !important;border-radius:2px !important}
@media only screen and (max-width:620px){
  .th-pad{padding-left:24px !important;padding-right:24px !important}
  .th-title{font-size:26px !important;letter-spacing:6px !important}
}
</style>
</head>
<body style="margin:0;padding:0;background-color:#0C1519;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%">
<span style="display:none !important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all">{{ subject }}</span>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#0C1519;margin:0;padding:0">
  <tr>
    <td align="center" style="padding:32px 12px">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;background-color:#0C1519;border:1px solid #3A3534">

        <tr>
          <td align="center" style="background-color:#162127;padding:34px 30px 26px 30px;border-bottom:1px solid #3A3534">
            <img src="https://theta.audio/assets/email/theta-mark.png" width="54" height="54" alt="" style="display:block;width:54px;height:54px;border:0;outline:none;text-decoration:none;margin:0 auto 16px auto">
            <div style="font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:14px;mso-line-height-rule:exactly;letter-spacing:7px;color:#DCCDBF;text-transform:uppercase;font-weight:bold">THETA</div>
            <div style="font-family:'JetBrains Mono','Courier New',Courier,monospace;font-size:9px;line-height:13px;mso-line-height-rule:exactly;letter-spacing:4px;color:#81848A;text-transform:uppercase;padding-top:8px">Audio&nbsp;Research</div>
          </td>
        </tr>
        <tr><td style="height:2px;line-height:2px;font-size:0;background-color:#FFB162">&nbsp;</td></tr>

        <tr>
          <td class="th-pad th-body" style="padding:44px 36px;font-family:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:27px;mso-line-height-rule:exactly;color:#B0B2B7">
            {{ message_content }}
          </td>
        </tr>

        <tr>
          <td class="th-pad" style="background-color:#162127;padding:26px 36px;border-top:1px solid #3A3534">
            <div style="font-family:'JetBrains Mono','Courier New',Courier,monospace;font-size:10px;line-height:19px;mso-line-height-rule:exactly;letter-spacing:2px;color:#81848A;text-transform:uppercase">
              <a href="{{ unsubscribe_url }}" style="color:#DCCDBF;text-decoration:underline">Unsubscribe</a>
              &nbsp;//&nbsp;
              <a href="https://theta.audio" style="color:#DCCDBF;text-decoration:underline">theta.audio</a>
            </div>
            <div style="font-family:'JetBrains Mono','Courier New',Courier,monospace;font-size:10px;line-height:18px;mso-line-height-rule:exactly;letter-spacing:1px;color:#5C6166;padding-top:12px">{{ address }}</div>
            <div style="font-family:'JetBrains Mono','Courier New',Courier,monospace;font-size:9px;line-height:16px;mso-line-height-rule:exactly;letter-spacing:3px;color:#4A5055;text-transform:uppercase;padding-top:14px">System_Stable&nbsp;//&nbsp;2026</div>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
